/* =========================================================
   HELPERS
   ========================================================= */
function agregarLogoPDF(pdf, y){
  // Pega aquí LOGO_BASE64 si lo tienes.
}

function nombrePDFInvestigacion(caso){
  return (caso.codigo||'INVESTIGACION')+' - Investigación F013.pdf';
}

/* =========================================================
   FUNCIÓN PRINCIPAL
   ========================================================= */
async function generarPDFInvestigacion(datos){
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('No se cargó jsPDF.');
    return;
  }

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({
    orientation:'portrait',
    unit:'mm',
    format:'a4',
    compress:true
  });

  const AZ=[0,65,84];
  const PL=[170,170,159];
  const NE=[0,0,0];
  const BL=[255,255,255];

  const M=8;
  const W=194;
  const LIM=289;

  let y=8;
  let page=1;

  /* =========================================================
     HEADER
     ========================================================= */
  function header(){
    agregarLogoPDF(pdf,y);

    pdf.setTextColor(...NE);
    pdf.setFont('helvetica','bold');
    pdf.setFontSize(10);

    pdf.text(
      'INVESTIGACIÓN DE ACCIDENTE DE TRABAJO',
      105,
      y+5,
      {align:'center'}
    );

    pdf.setFont('helvetica','normal');
    pdf.setFontSize(5.5);

    // Los metadatos quedan alineados y sin superposición.
    pdf.text('CÓDIGO: SGSST_INDRAGROUP_F 013',202,y+2,{align:'right'});
    pdf.text('VERSIÓN: 02',202,y+4.5,{align:'right'});
    pdf.text('FECHA: 2026-09-23',202,y+7,{align:'right'});

    y+=14;
  }

  function npi(h){
    if(y+h>LIM){
      pdf.addPage();
      page++;
      y=8;
      header();
    }
  }

  function band(s){
    npi(5);

    pdf.setFillColor(...AZ);
    pdf.setDrawColor(...NE);
    pdf.rect(M,y,W,5,'FD');

    pdf.setTextColor(...BL);
    pdf.setFont('helvetica','bold');
    pdf.setFontSize(7);

    pdf.text(s,M+2,y+3.2);

    y+=5;
  }

  function cell(x,w,h,txt,o={}){
    pdf.setFillColor(...(o.bg||BL));
    pdf.setDrawColor(...NE);
    pdf.rect(x,y,w,h,'FD');

    pdf.setTextColor(...(o.fg||NE));
    pdf.setFont('helvetica',o.bold?'bold':'normal');
    pdf.setFontSize(o.fs||6);

    const s=String(txt??'');
    if(!s) return;

    const lines=pdf.splitTextToSize(
      s,
      Math.max(3,w-2.5)
    );

    const lh=o.lh||2.5;
    const tot=(lines.length-1)*lh;
    const sy=y+h/2-tot/2;

    lines.forEach((l,i)=>{
      pdf.text(
        l,
        o.left?x+1.5:x+w/2,
        sy+i*lh,
        {
          align:o.left?'left':'center',
          baseline:'middle'
        }
      );
    });
  }

  function row(lbl,val,lw){
    lw=lw||48.5;
    const vw=W-lw;
    const h=5;

    npi(h);

    cell(M,lw,h,lbl,{
      bg:AZ,
      fg:BL,
      bold:true,
      left:true,
      fs:6
    });

    cell(M+lw,vw,h,val||'-',{fs:6});

    y+=h;
  }

  function filaOpciones(opciones, seleccionado, alto){
    alto=alto||6;

    const n=opciones.length;
    const w=W/n;

    npi(alto);

    opciones.forEach((op,i)=>{
      const marcado=seleccionado &&
        accTextoIgual_(seleccionado,op);

      cell(
        M+i*w,
        w,
        alto,
        (marcado?'[X] ':'[ ] ')+op,
        {
          fs:6,
          bold:marcado
        }
      );
    });

    y+=alto;
  }

  function accTextoIgual_(a,b){
    return String(a||'').trim().toUpperCase() ===
           String(b||'').trim().toUpperCase();
  }

  header();

  /* ============================================================
     BLOQUE 1 — DATOS DEL EMPLEADOR
     ============================================================ */

  const c=datos.compartido;

  // IMPORTANTE: "DATOS DEL EMPLEADOR" es PLOMO (#AAAA9F),
  // no una banda azul.
  npi(5);
  pdf.setFillColor(...PL);
  pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,5,'FD');
  pdf.setTextColor(...NE);
  pdf.setFont('helvetica','bold');
  pdf.setFontSize(7);
  pdf.text('DATOS DEL EMPLEADOR',M+2,y+3.2);
  y+=5;


  /* ------------------------------------------------------------
     EMPLEADOR PRINCIPAL — título azul
     ------------------------------------------------------------ */

  npi(5);
  pdf.setFillColor(...AZ);
  pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,5,'FD');
  pdf.setTextColor(...BL);
  pdf.setFont('helvetica','bold');
  pdf.setFontSize(7);
  pdf.text('DATOS DEL EMPLEADOR PRINCIPAL',M+2,y+3.2);
  y+=5;


  /* ------------------------------------------------------------
     RAZÓN SOCIAL / RUC / DOMICILIO / ACTIVIDAD / N° TRABAJADORES
     Encabezado en PLOMO.
     ------------------------------------------------------------ */

  {
    const w=[42,18,46,38,50];

    const x=[
      M,
      M+w[0],
      M+w[0]+w[1],
      M+w[0]+w[1]+w[2],
      M+w[0]+w[1]+w[2]+w[3]
    ];

    const h=5;

    npi(h);

    [
      'RAZÓN SOCIAL',
      'RUC',
      'DOMICILIO (Dirección, Distrito, Departamento, Provincia)',
      'ACTIVIDAD ECONÓMICA',
      'N° TRABAJADORES EN EL CENTRO LABORAL'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{
        bg:PL,
        fg:NE,
        bold:true,
        fs:5.2
      });
    });

    y+=h;

    npi(h);

    [
      datos.caso.sociedad||'-',
      datos.caso.ruc||'-',
      c.domicilioEmpleador ||
        'AV. JORGE BASADRE NRO. 233 INT. 901, SAN ISIDRO',
      c.actividadEconomicaEmpleador ||
        'ACTIVIDADES DE CONSULTORÍA DE GESTIÓN',
      c.numTrabajadores||'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:5.8});
    });

    y+=h;
  }


  /* ------------------------------------------------------------
     ALTO RIESGO — texto PLOMO #AAAA9F
     ------------------------------------------------------------ */

  npi(5);
  pdf.setFillColor(...PL);
  pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,5,'FD');
  pdf.setTextColor(...NE);
  pdf.setFont('helvetica','italic');
  pdf.setFontSize(5.3);
  pdf.text(
    'COMPLETAR SÓLO EN CASO QUE LAS ACTIVIDADES DEL EMPLEADOR SEAN CONSIDERADAS DE ALTO RIESGO',
    M+2,
    y+3.2
  );
  y+=5;


  /* ------------------------------------------------------------
     SCTR — SIEMPRE 3 COLUMNAS IGUALES
     ------------------------------------------------------------ */

  {
    const w=[W/3,W/3,W/3];

    const x=[
      M,
      M+w[0],
      M+w[0]+w[1]
    ];

    const h=5;

    npi(h);

    [
      'N° TRABAJADORES AFILIADOS AL SCTR',
      'N° TRABAJADORES NO AFILIADOS AL SCTR',
      'NOMBRE DE LA ASEGURADORA'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{
        bg:PL,
        fg:NE,
        bold:true,
        fs:5.2
      });
    });

    y+=h;

    npi(h);

    [
      c.altoRiesgo==='SI'?(c.sctrAfiliados||'-'):'-',
      c.altoRiesgo==='SI'?(c.sctrNoAfiliados||'-'):'-',
      c.altoRiesgo==='SI'?(c.aseguradora||'-'):'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:6});
    });

    y+=h;
  }

  y+=2;


  /* ------------------------------------------------------------
     INTERMEDIACIÓN / CONTRATISTA — título PLOMO
     ------------------------------------------------------------ */

  npi(5);
  pdf.setFillColor(...PL);
  pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,5,'FD');
  pdf.setTextColor(...NE);
  pdf.setFont('helvetica','bold');
  pdf.setFontSize(6.3);
  pdf.text(
    'DATOS DEL EMPLEADOR DE INTERMEDIACION, TERCERIZACION, CONTRATISTA, SUBCONTRATISTA, OTROS',
    M+2,
    y+3.2
  );
  y+=5;

  const contAplica=c.contratistaAplica==='SI';


  /* ------------------------------------------------------------
     CONTRATISTA — incluye N° TRABAJADORES
     ------------------------------------------------------------ */

  {
    const w=[15,43,18,43,42,33];

    const x=[
      M,
      M+w[0],
      M+w[0]+w[1],
      M+w[0]+w[1]+w[2],
      M+w[0]+w[1]+w[2]+w[3],
      M+w[0]+w[1]+w[2]+w[3]+w[4]
    ];

    const h=5;

    npi(h);

    [
      '¿APLICA?',
      'RAZÓN SOCIAL O DENOMINACIÓN SOCIAL',
      'RUC',
      'DOMICILIO (Dirección, Distrito, Departamento, Provincia)',
      'ACTIVIDAD ECONÓMICA',
      'N° TRABAJADORES EN EL CENTRO LABORAL'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{
        bg:PL,
        fg:NE,
        bold:true,
        fs:4.9
      });
    });

    y+=h;

    npi(h);

    [
      contAplica?'SI':'NO',
      contAplica?(c.contratistaRazonSocial||'-'):'-',
      contAplica?(c.contratistaRuc||'-'):'-',
      contAplica?(c.contratistaDomicilio||'-'):'-',
      contAplica?(c.contratistaActividad||'-'):'-',
      contAplica?(c.contratistaNumTrabajadores||'-'):'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:5.5});
    });

    y+=h;
  }


  /* ------------------------------------------------------------
     ALTO RIESGO — CONTRATISTA
     ------------------------------------------------------------ */

  npi(5);
  pdf.setFillColor(...PL);
  pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,5,'FD');
  pdf.setTextColor(...NE);
  pdf.setFont('helvetica','italic');
  pdf.setFontSize(5.3);
  pdf.text(
    'COMPLETAR SÓLO EN CASO QUE LAS ACTIVIDADES DEL EMPLEADOR SEAN CONSIDERADAS DE ALTO RIESGO',
    M+2,
    y+3.2
  );
  y+=5;


  {
    const w=[W/3,W/3,W/3];

    const x=[
      M,
      M+w[0],
      M+w[0]+w[1]
    ];

    const h=5;

    npi(h);

    [
      'N° TRABAJADORES AFILIADOS AL SCTR',
      'N° TRABAJADORES NO AFILIADOS AL SCTR',
      'NOMBRE DE LA ASEGURADORA'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{
        bg:PL,
        fg:NE,
        bold:true,
        fs:5.2
      });
    });

    y+=h;

    npi(h);

    [
      (contAplica&&c.contratistaAltoRiesgo==='SI')
        ?(c.contratistaSctrAfiliados||'-')
        :'-',

      (contAplica&&c.contratistaAltoRiesgo==='SI')
        ?(c.contratistaSctrNoAfiliados||'-')
        :'-',

      (contAplica&&c.contratistaAltoRiesgo==='SI')
        ?(c.contratistaAseguradora||'-')
        :'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:6});
    });

    y+=h;
  }

  y+=3;

  /* ============================================================
     BLOQUE 2 — DATOS DEL TRABAJADOR
     ============================================================ */

  // Encabezado de sección en azul.
  band('DATOS DEL TRABAJADOR');

  const trabajadores=datos.caso.involucrados||[];

  trabajadores.forEach(p=>{

    const t=datos.porTrabajador[p.idInvolucrado]||{};


    /* ----------------------------------------------------------
       FILA 1:
       NOMBRES Y APELLIDOS | DNI | EDAD
       ---------------------------------------------------------- */

    {
      const w=[118,45,31];

      const x=[
        M,
        M+w[0],
        M+w[0]+w[1]
      ];

      const h=5;

      npi(h);

      [
        'NOMBRES Y APELLIDOS:',
        'DNI:',
        'EDAD:'
      ].forEach((txt,i)=>{
        cell(x[i],w[i],h,txt,{
          bg:PL,
          fg:NE,
          bold:true,
          left:true,
          fs:6
        });
      });

      y+=h;

      npi(h);

      [
        p.nombre||'-',
        p.dni||'-',
        t.edad||'-'
      ].forEach((txt,i)=>{
        cell(x[i],w[i],h,txt,{fs:6});
      });

      y+=h;
    }


    /* ----------------------------------------------------------
       FILA 2 — ENCABEZADOS DE DATOS LABORALES
       ---------------------------------------------------------- */

    {
      const w=[
        24, // Proyecto
        22, // Área
        27, // Puesto
        25, // Antigüedad
        15, // Sexo
        15, // Turno
        19, // Contrato
        25, // Experiencia
        22  // Horas
      ];

      const x=[];
      let ax=M;
      w.forEach(v=>{
        x.push(ax);
        ax+=v;
      });

      const h=5;

      npi(h);

      [
        'PROYECTO',
        'ÁREA',
        'PUESTO DE TRABAJO',
        'ANTIGÜEDAD EN EL EMPLEO',
        'SEXO F/M',
        'TURNO D/T/N',
        'TIPO DE CONTRATO',
        'TIEMPO DE EXPERIENCIA EN EL PUESTO DE TRABAJO',
        'N° HORAS TRABAJADAS (Antes del Accidente)'
      ].forEach((txt,i)=>{
        cell(x[i],w[i],h,txt,{
          bg:PL,
          fg:NE,
          bold:true,
          fs:4.7
        });
      });

      y+=h;

      npi(h);

      [
        p.proyecto||'-',
        p.area||t.area||'-',
        p.cargo||'-',
        t.antiguedad||'-',
        t.sexo||'-',

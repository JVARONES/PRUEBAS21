<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flash Report - Formato</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#d9d9d9;
    font-family:Arial, Helvetica, sans-serif;
    color:#000;
}


/* =========================================================
   HOJA A4
========================================================= */

.page{
    width:210mm;
    min-height:297mm;

    margin:20px auto;

    background:#fff;

    padding:8mm;

    box-shadow:0 0 10px rgba(0,0,0,.25);

    position:relative;

    font-size:8pt;
}


/* =========================================================
   COLORES DEL FORMATO
========================================================= */

:root{
    --azul-indra:#004254;
    --gris:#E4E3DA;
    --negro:#000;
    --blanco:#fff;
}


/* =========================================================
   ENCABEZADO
========================================================= */

.header{
    width:100%;

    display:grid;

    grid-template-columns:40mm 1fr 40mm;

    align-items:center;

    min-height:22mm;

    margin-bottom:5mm;
}


/* LOGO */

.logo{
    height:17mm;

    display:flex;
    align-items:center;
    justify-content:flex-start;
}

.logo img{
    max-width:35mm;
    max-height:16mm;
    object-fit:contain;
}


/* TÍTULO */

.title{
    text-align:center;

    font-size:12pt;

    font-weight:bold;

    line-height:1.25;

    text-transform:uppercase;
}


/* CÓDIGO */

.code{
    font-size:5pt;

    line-height:1.35;

    text-align:left;

    align-self:flex-start;
}


/* =========================================================
   BLOQUES DE SECCIÓN
========================================================= */

.section-title{

    width:100%;

    height:7mm;

    background:var(--gris);

    border:1px solid var(--negro);

    display:flex;

    align-items:center;

    padding-left:3mm;

    font-size:7pt;

    font-weight:bold;

    text-transform:uppercase;

    margin-top:2mm;
}


/* SECCIÓN AZUL */

.section-title.blue{

    background:var(--azul-indra);

    color:var(--blanco);

    justify-content:center;

    padding-left:0;
}


/* =========================================================
   TABLAS
========================================================= */

.table{
    width:100%;

    border-collapse:collapse;

    table-layout:fixed;
}

.table td,
.table th{

    border:1px solid var(--negro);

    height:8mm;

    padding:2mm;

    vertical-align:middle;

    font-size:7pt;
}


/* CABECERA GRIS */

.table th{
    background:var(--gris);

    font-weight:bold;

    text-align:center;
}


/* CABECERA AZUL */

.table .blue-cell{

    background:var(--azul-indra);

    color:#fff;

    font-weight:bold;

    text-align:center;
}


/* CELDA VACÍA */

.empty{
    background:#fff;

    height:8mm;
}


/* =========================================================
   TABLA DE DATOS GENERALES
========================================================= */

.general td{
    height:9mm;
}

.label{
    background:var(--gris);

    font-weight:bold;

    width:25%;
}


/* =========================================================
   ÁREA GRANDE PARA DESCRIPCIÓN
========================================================= */

.description{

    width:100%;

    height:48mm;

    border:1px solid #000;

    background:#fff;
}


/* =========================================================
   ÁREA DE EVIDENCIAS FOTOGRÁFICAS
========================================================= */

.photo-section{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:3mm;

    padding:3mm;

    border:1px solid #000;

    min-height:65mm;
}


.photo-box{

    border:1px solid #000;

    min-height:55mm;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;
}


/* =========================================================
   TABLA DE RESPONSABLE
========================================================= */

.signature-table td{

    height:25mm;

    vertical-align:top;
}

.signature{

    height:20mm;

    position:relative;
}


/* =========================================================
   PIE
========================================================= */

.footer{

    margin-top:4mm;

    display:grid;

    grid-template-columns:1fr 1fr;

    border-top:1px solid #000;

    font-size:5.5pt;
}

.footer div{

    padding-top:2mm;
}


/* =========================================================
   IMPRESIÓN
========================================================= */

@media print{

    body{
        background:#fff;
    }

    .page{

        margin:0;

        box-shadow:none;

        width:210mm;

        min-height:297mm;

        page-break-after:always;
    }

    @page{

        size:A4 portrait;

        margin:0;
    }
}


/* =========================================================
   VISTA EN PANTALLA
========================================================= */

@media(max-width:900px){

    .page{
        transform-origin:top left;
        margin-left:10px;
    }

}

</style>
</head>

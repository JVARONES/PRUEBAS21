/* =========================================================
   HELPERS GENERALES
   ========================================================= */
function agregarLogoPDF(pdf, y){
  // Pega aquí LOGO_BASE64 si lo tienes.
}

/* =========================================================
   FUNCIÓN PRINCIPAL
   ========================================================= */
async function generarPDFInvestigacion(datos){
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('No se cargó jsPDF.');
    return;
  }

  const {jsPDF}=window.jspdf;
  const AZ=[0,65,84];
  const PL=[225,224,215]; // gris claro original (el mismo del Flash Report)
  const NE=[0,0,0];
  const BL=[255,255,255];
  const GR=[170,170,159]; //gris oscuro

  const M=8;
  const W=194;
  const LIM=289;

  let pdf, y, page;
  let TOTAL_PAG=null;

  function crearPdf(){
    pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    y=8; page=1;
  }

  /* =========================================================
     HEADER — 4 líneas
     ========================================================= */
  function header(){
    agregarLogoPDF(pdf,y);

    pdf.setTextColor(...NE);
    pdf.setFont('helvetica','bold');
    pdf.setFontSize(10);

    pdf.text(
      'REGISTRO DE INVESTIGACIÓN DE ACCIDENTES DE TRABAJO',
      105,
      y+5,
      {align:'center'}
    );

    pdf.setFont('helvetica','normal');
    pdf.setFontSize(5.5);

    pdf.text('CÓDIGO: SGSST_INDRAGROUP_F 013',202,y+2,{align:'right'});
    pdf.text('VERSIÓN: 02',202,y+4.5,{align:'right'});
    pdf.text('FECHA: 2026-09-23',202,y+7,{align:'right'});
    pdf.text('PÁGINA: '+page+(TOTAL_PAG?(' DE '+TOTAL_PAG):''),202,y+9.5,{align:'right'});

    y+=15;
  }

  function npi(h){
    if(y+h>LIM){
      pdf.addPage();
      page++;
      y=8;
      header();
    }
  }

  function band(s){
    npi(5);
    pdf.setFillColor(...AZ); pdf.setDrawColor(...NE);
    pdf.rect(M,y,W,5,'FD');
    pdf.setTextColor(...BL); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
    pdf.text(s,M+2,y+3.2);
    y+=5;
  }

  /* Banda plomo oscuro de instrucción — SIEMPRE alto 3 */
  function bandaInstruccion(s, centrado){
    npi(3);
    pdf.setFillColor(...PL); pdf.setDrawColor(...NE);
    pdf.rect(M,y,W,3,'FD');
    pdf.setTextColor(...NE); pdf.setFont('helvetica','italic'); pdf.setFontSize(5);
    pdf.text(s, centrado?(M+W/2):(M+2), y+2.0, centrado?{align:'center'}:{});
    y+=3;
  }

  /* Banda de 2 líneas en una sola fila de alto 5 (título + instrucción) */
  function bandaDoble(azul, linea1, linea2){
    npi(5);
    pdf.setFillColor(...azul); pdf.setDrawColor(...NE);
    pdf.rect(M,y,W,5,'FD');
    pdf.setTextColor(...BL);
    const lh=2.4, sy=y+5/2-lh/2;
    pdf.setFont('helvetica','bold'); pdf.setFontSize(5.3);
    pdf.text(linea1,M+2,sy,{baseline:'middle'});
    pdf.setFont('helvetica','normal'); pdf.setFontSize(4.3);
    pdf.text(linea2,M+2,sy+lh,{baseline:'middle'});
    y+=5;
  }

  function cell(x,w,h,txt,o={}){
    pdf.setFillColor(...(o.bg||BL));
    pdf.setDrawColor(...NE);
    pdf.rect(x,y,w,h,'FD');

    pdf.setTextColor(...(o.fg||NE));
    pdf.setFont('helvetica',o.bold?'bold':'normal');
    pdf.setFontSize(o.fs||5);

    const s=String(txt??'');
    if(!s) return;

    const lines=pdf.splitTextToSize(s, Math.max(3,w-2.5));
    const lh=o.lh||2.5;
    const tot=(lines.length-1)*lh;
    const sy=y+h/2-tot/2;

    lines.forEach((l,i)=>{
      pdf.text(l, o.left?x+1.5:x+w/2, sy+i*lh,
        {align:o.left?'left':'center', baseline:'middle'});
    });
  }

  /* Dibuja una celda EN UNA COORDENADA Y ESPECÍFICA (no la global `y`) */
  function cellAt(x,yy,w,h,txt,o={}){
    pdf.setFillColor(...(o.bg||BL));
    pdf.setDrawColor(...NE);
    pdf.rect(x,yy,w,h,'FD');

    pdf.setTextColor(...(o.fg||NE));
    pdf.setFont('helvetica',o.bold?'bold':'normal');
    pdf.setFontSize(o.fs||5);

    const s=String(txt??'');
    if(!s) return;

    const lines=pdf.splitTextToSize(s, Math.max(3,w-2.5));
    const lh=o.lh||2.3;
    const tot=(lines.length-1)*lh;
    const sy=yy+h/2-tot/2;

    lines.forEach((l,i)=>{
      pdf.text(l, o.left?x+1.5:x+w/2, sy+i*lh,
        {align:o.left?'left':'center', baseline:'middle'});
    });
  }

  function row(lbl,val,lw){
    lw=lw||48.5;
    const vw=W-lw;
    const h=5;
    npi(h);
    cell(M,lw,h,lbl,{bg:AZ,fg:BL,bold:true,left:true,fs:6});
    cell(M+lw,vw,h,val||'-',{fs:6});
    y+=h;
  }

  function filaOpciones(opciones, seleccionado, alto){
    alto=alto||5;
    const n=opciones.length;
    const w=W/n;
    npi(alto);
    opciones.forEach((op,i)=>{
      const marcado=seleccionado && accTextoIgual_(seleccionado,op);
      cell(M+i*w, w, alto, (marcado?'[X] ':'[ ] ')+op, {fs:6, bold:marcado});
    });
    y+=alto;
  }

  function accTextoIgual_(a,b){
    return String(a||'').trim().toUpperCase() === String(b||'').trim().toUpperCase();
  }

  function catsCount_(c){
    const cats=['actos','condiciones','factoresPersonales','factoresTrabajo'];
    return cats.reduce((n,k)=>n+(c.scat[k]||[]).filter(item=>c.analisisCausaRaiz&&c.analisisCausaRaiz[item.id]).length,0);
  }

  /* Dos líneas centradas como bloque único (mismo criterio que cell()) */
  function cellDosLineas(x,w,h,l1,l2,o={}){
    pdf.setFillColor(...(o.bg||BL)); pdf.setDrawColor(...NE);
    pdf.rect(x,y,w,h,'FD');
    pdf.setTextColor(...(o.fg||NE));
    const lh=2.4;
    const sy=y+h/2-lh/2;
    pdf.setFont('helvetica','bold'); pdf.setFontSize(5);
    pdf.text(l1, x+w/2, sy, {align:'center',baseline:'middle'});
    pdf.setFont('helvetica','normal'); pdf.setFontSize(5);
    pdf.text(l2, x+w/2, sy+lh, {align:'center',baseline:'middle'});
  }

  function construirContenido(){

  header();

  /* ============================================================
     BLOQUE 1 — DATOS DEL EMPLEADOR
     ============================================================ */
  const c=datos.compartido;

  npi(4);
  pdf.setFillColor(...PL); pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,4,'FD');
  pdf.setTextColor(...NE); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('DATOS DEL EMPLEADOR',M+2,y+2.7);
  y+=4;

  npi(5);
  pdf.setFillColor(...AZ); pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,5,'FD');
  pdf.setTextColor(...BL); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('DATOS DEL EMPLEADOR PRINCIPAL',M+2,y+3.2);
  y+=5;

  {
    const w=[32,32,66,32,32];
    const x=[M, M+w[0], M+w[0]+w[1], M+w[0]+w[1]+w[2], M+w[0]+w[1]+w[2]+w[3]];
    const h=5;
    npi(h);
    ['RAZÓN SOCIAL','RUC','DOMICILIO (Dirección, Distrito, Departamento, Provincia)','ACTIVIDAD ECONÓMICA','N° TRABAJADORES EN EL CENTRO LABORAL'].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{bg:PL,fg:NE,bold:true,fs:5.2});
    });
    y+=h;
    npi(h);
    [
      datos.caso.sociedad||'-', datos.caso.ruc||'-',
      c.domicilioEmpleador || 'AV. JORGE BASADRE NRO. 233 INT. 901, SAN ISIDRO',
      c.actividadEconomicaEmpleador || 'ACTIVIDADES DE CONSULTORÍA DE GESTIÓN',
      c.numTrabajadores||'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:5.8});
    });
    y+=h;
  }

  bandaInstruccion('COMPLETAR SÓLO EN CASO QUE LAS ACTIVIDADES DEL EMPLEADOR SEAN CONSIDERADAS DE ALTO RIESGO');

  {
    const w=[64,66,64];
    const x=[M, M+w[0], M+w[0]+w[1]];
    const h=4;
    npi(h);
    ['N° TRABAJADORES AFILIADOS AL SCTR','N° TRABAJADORES NO AFILIADOS AL SCTR','NOMBRE DE LA ASEGURADORA'].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{bg:PL,fg:NE,bold:true,fs:5.2});
    });
    y+=h;
    npi(h);
    [
      c.altoRiesgo==='SI'?(c.sctrAfiliados||'-'):'-',
      c.altoRiesgo==='SI'?(c.sctrNoAfiliados||'-'):'-',
      c.altoRiesgo==='SI'?(c.aseguradora||'-'):'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:6});
    });
    y+=h;
  }
  y+=2;

  npi(4);
  pdf.setFillColor(...PL); pdf.setDrawColor(...NE);
  pdf.rect(M,y,W,4,'FD');
  pdf.setTextColor(...NE); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('DATOS DEL EMPLEADOR DE INTERMEDIACION, TERCERIZACION, CONTRATISTA, SUBCONTRATISTA, OTROS',M+2,y+2.7);
  y+=4;

  const contAplica=c.contratistaAplica==='SI';

  /*
   * ¿APLICA? = 1/6 del tercio de referencia (65/6≈11).
   * RUC sin cambios (21). RAZÓN SOCIAL absorbe lo liberado (33).
   */
  {
    const w=[12,33,19,66,32,32];
    const x=[]; let acc=M; w.forEach(v=>{x.push(acc); acc+=v;});
    const h=5;
    npi(h);
    ['¿APLICA?','RAZÓN SOCIAL O DENOMINACIÓN SOCIAL','RUC','DOMICILIO (Dirección, Distrito, Departamento, Provincia)','ACTIVIDAD ECONÓMICA','N° TRABAJADORES EN EL CENTRO LABORAL'].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{bg:PL,fg:NE,bold:true,fs:4.8});
    });
    y+=h;
    npi(h);
    [
      contAplica?'SI':'NO',
      contAplica?(c.contratistaRazonSocial||'-'):'-',
      contAplica?(c.contratistaRuc||'-'):'-',
      contAplica?(c.contratistaDomicilio||'-'):'-',
      contAplica?(c.contratistaActividad||'-'):'-',
      contAplica?(c.contratistaNumTrabajadores||'-'):'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:5.5});
    });
    y+=h;
  }

  bandaInstruccion('COMPLETAR SÓLO EN CASO QUE LAS ACTIVIDADES DEL EMPLEADOR SEAN CONSIDERADAS DE ALTO RIESGO');

  {
    const w=[64,66,64];
    const x=[M, M+w[0], M+w[0]+w[1]];
    const h=4;
    npi(h);
    ['N° TRABAJADORES AFILIADOS AL SCTR','N° TRABAJADORES NO AFILIADOS AL SCTR','NOMBRE DE LA ASEGURADORA'].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{bg:PL,fg:NE,bold:true,fs:5.2});
    });
    y+=h;
    npi(h);
    [
      (contAplica&&c.contratistaAltoRiesgo==='SI')?(c.contratistaSctrAfiliados||'-'):'-',
      (contAplica&&c.contratistaAltoRiesgo==='SI')?(c.contratistaSctrNoAfiliados||'-'):'-',
      (contAplica&&c.contratistaAltoRiesgo==='SI')?(c.contratistaAseguradora||'-'):'-'
    ].forEach((txt,i)=>{
      cell(x[i],w[i],h,txt,{fs:6});
    });
    y+=h;
  }
  y+=3;

  /* ============================================================
     BLOQUE 2 — DATOS DEL TRABAJADOR
     ============================================================ */
  band('DATOS DEL TRABAJADOR');

  const trabajadores=datos.caso.involucrados||[];

  trabajadores.forEach(p=>{
    const t=datos.porTrabajador[p.idInvolucrado]||{};

    /*
     * FILA 1 — Nombre(130) + DNI(32,=Actividad Económica) + Edad(32,=NTrabajadores)
     */
    {
      const w=[38,92,10,22,10,22];
      const x=[]; let acc=M; w.forEach(v=>{x.push(acc); acc+=v;});
      const h=4;
      npi(h);
      cell(x[0],w[0],h,'NOMBRES Y APELLIDOS:',{bg:AZ,fg:BL,bold:true,left:true,fs:5.8});
      cell(x[1],w[1],h,p.nombre||'-',{fs:6,left:true});
      cell(x[2],w[2],h,'DNI:',{bg:AZ,fg:BL,bold:true,fs:5.6});
      cell(x[3],w[3],h,p.dni||'-',{fs:6});
      cell(x[4],w[4],h,'EDAD:',{bg:AZ,fg:BL,bold:true,fs:5.3});
      cell(x[5],w[5],h,t.edad||'-',{fs:6});
      y+=h;
    }

    /*
     * FILA 2 — SEXO y TURNO con encabezado de 2 líneas (SEXO / F-M, TURNO / D-T-N)
     */
    {
      /*
       * Puesto termina donde termina la 1ª columna del SCTR (65).
       * Contrato termina donde empieza "Nombre de la aseguradora" (129).

      marks.forEach((m,i)=>{
        cellAt(xCol3+i*wMarca, y, wMarca, h, m?'X':'', {fs:5.5,bold:true});
      });
      y+=h;
    });
  }
  y+=3;

  /* ============================================================
     BLOQUE 8 — CAUSAS SCAT (Cuadro III)
     Mitad izquierda: causas inmediatas (Actos+Condiciones).
     Mitad derecha: causas básicas (Fact. Personales+Trabajo).
     ============================================================ */
  band('CAUSAS DEL ACCIDENTE (Cuadro III — Metodología SCAT)');
  {
    const wNum=8, wOpcionSel=27, wDesc=62; // dentro de cada mitad de 97 (8+27+62=97)

    function bandaMitad(xBase, titulo){
      pdf.setFillColor(...PL); pdf.setDrawColor(...NE);
      pdf.rect(xBase,y,MITAD,5,'FD');
      pdf.setTextColor(...NE); pdf.setFont('helvetica','bold'); pdf.setFontSize(5.5);
      pdf.text(titulo,xBase+2,y+3.2);
    }

    /*
     * Dibuja una fila de causa: numeral (AS01) | opción seleccionada del
     * catálogo (item.opcion) | descripción de la desviación (item.descripcion).
     * Si el ítem no existe se dibuja igual con celdas vacías, para que
     * ambas columnas coincidan en alto.
     */
    function filaCausa(xBase, abrev, indice, item){
      const h=5;
      npi(h);
      const numeral = abrev+String(indice+1).padStart(2,'0');
      cellAt(xBase, y, wNum, h, numeral, {bold:true});
      cellAt(xBase+wNum, y, wOpcionSel, h, item?(item.opcion||''):'', {left:true,fs:4.4});
      cellAt(xBase+wNum+wOpcionSel, y, wDesc, h, item?(item.descripcion||''):'', {left:true});
    }

    /* Título de cada mitad */
    npi(5);
    bandaMitad(M, 'CAUSAS INMEDIATAS');
    bandaMitad(M+MITAD, 'CAUSAS BÁSICAS');
    y+=5;

    /* Encabezado — UNA SOLA VEZ por mitad */
    npi(5);
    cellAt(M, y, wNum, 5, 'N°', {bg:PL,bold:true,fs:4.4});
    cellAt(M+wNum, y, wOpcionSel, 5, 'Opción seleccionada', {bg:PL,bold:true,fs:4.2});
    cellAt(M+wNum+wOpcionSel, y, wDesc, 5, 'Descripción de la desviación', {bg:PL,bold:true,fs:4.4});
    cellAt(M+MITAD, y, wNum, 5, 'N°', {bg:PL,bold:true,fs:4.4});
    cellAt(M+MITAD+wNum, y, wOpcionSel, 5, 'Opción seleccionada', {bg:PL,bold:true,fs:4.2});
    cellAt(M+MITAD+wNum+wOpcionSel, y, wDesc, 5, 'Descripción de la desviación', {bg:PL,bold:true,fs:4.4});
    y+=5;

    /*
     * Por cada par (Actos<->Factores Personales, Condiciones<->Factores
     * de Trabajo): mismo número de filas en ambos lados, rellenando con
     * vacío el lado que tenga menos causas.
     */
    function bloquePar(catIzq, tituloIzq, abrevIzq, catDer, tituloDer, abrevDer){
      npi(4);
      cellAt(M,y,MITAD,4,tituloIzq,{bg:AZ,fg:BL,bold:true,left:true,fs:4.4});
      cellAt(M+MITAD,y,MITAD,4,tituloDer,{bg:AZ,fg:BL,bold:true,left:true,fs:4.4});
      y+=4;

      const listaIzq = c.scat[catIzq]||[];
      const listaDer = c.scat[catDer]||[];
      const filas = Math.max(listaIzq.length, listaDer.length, 1);

      for(let i=0;i<filas;i++){
        const h=5;
        npi(h);
        filaCausa(M, abrevIzq, i, listaIzq[i]||null);
        filaCausa(M+MITAD, abrevDer, i, listaDer[i]||null);
        y+=h;
      }
    }

    bloquePar('actos','ACTOS SUBESTÁNDAR','AS', 'factoresPersonales','FACTORES PERSONALES','FP');
    bloquePar('condiciones','CONDICIONES SUBESTÁNDAR','CS', 'factoresTrabajo','FACTORES DEL TRABAJO','FT');
  }
  y+=3;

  /* ============================================================
     MEDIDAS CORRECTIVAS
     Altura dinámica por N° de líneas: 1 línea=4, 2=5, 3=7, 4=9...
     (a partir de 2, +2 por cada línea adicional).
     ============================================================ */
  function alturaPorLineas_(n){
    if(n<=1) return 4;
    return 2*n+2;
  }

  band('MEDIDAS CORRECTIVAS');
  {
    /* Fecha y Estado reducidos; el espacio liberado va a Evidencia (texto largo). */
    /* Responsable y Evidencia ensanchados; Causa raíz/Descripción se ajustan. */
    const wM=[44,52,28,16,16,38];
    const xM=[]; let acc5=M; wM.forEach(w=>{xM.push(acc5); acc5+=w;});
    const h=5;

    npi(h);
    ['CAUSA RAÍZ (Anexo 04)','DESCRIPCIÓN ACCIÓN CORRECTIVA','RESP.','FECHA','ESTADO','EVIDENCIA'].forEach((s,i)=>{
      cell(xM[i],wM[i],h,s,{bg:PL,bold:true,fs:4.6});
    });
    y+=h;

    pdf.setFont('helvetica','normal');
    (c.medidasCorrectivas||[]).forEach(m=>{
      const textos=[m.causaRaizTexto||'-', m.descripcion||'-'];
      let maxLineas=1;
      textos.forEach((txt,i)=>{
        pdf.setFontSize(4.8);
        const lns=pdf.splitTextToSize(String(txt), Math.max(3,wM[i]-2.5));
        maxLineas=Math.max(maxLineas,lns.length);
      });
      const hFila=alturaPorLineas_(maxLineas);
      npi(hFila);
      [
        m.causaRaizTexto||'-', m.descripcion||'-', (m.responsable&&m.responsable.nombre)||'-',
        m.fecha||'-', m.estado||'-', m.evidencia||'-'
      ].forEach((s,i)=>{
        cell(xM[i],wM[i],hFila,s,{fs:4.8});
      });
      y+=hFila;
    });
  }
  y+=3;

  /* ============================================================
     RESPONSABLES — una sola fila de 194 por cada uno
     ============================================================ */
  band('RESPONSABLES');
  {
    /* Mismas proporciones que la tabla de responsable del Flash Report */
    const wR=[62,48,42,42];
    const xR=[]; let acc6=M; wR.forEach(w=>{xR.push(acc6); acc6+=w;});

    npi(4); cell(M,W,4,'RESPONSABLE DEL REGISTRO',{bg:PL,bold:true,left:true,fs:5}); y+=4;
    npi(5);
    ['NOMBRE','CARGO','FECHA','FIRMA'].forEach((s,i)=>{
      cell(xR[i],wR[i],5,s,{bg:AZ,fg:BL,bold:true,fs:5.5});
    });
    y+=5;
    npi(14);
    cell(xR[0],wR[0],14,(c.responsableRegistro&&c.responsableRegistro.nombre)||'-',{fs:5.5});
    cell(xR[1],wR[1],14,'-',{fs:5.5});
    cell(xR[2],wR[2],14,'-',{fs:5.5});
    cell(xR[3],wR[3],14,'',{fs:5.5});
    y+=14;
    y+=2;

    npi(4); cell(M,W,4,'RESPONSABLE(S) DE LA INVESTIGACIÓN',{bg:PL,bold:true,left:true,fs:5}); y+=4;
    npi(5);
    ['NOMBRE','CARGO','FECHA','FIRMA'].forEach((s,i)=>{
      cell(xR[i],wR[i],5,s,{bg:AZ,fg:BL,bold:true,fs:5.5});
    });
    y+=5;

    /* Mínimo 3 filas visibles, aunque estén vacías */
    const listaResp = c.responsablesInvestigacion||[];
    const filasAMostrar = Math.max(3, listaResp.length);
    for(let i=0;i<filasAMostrar;i++){
      const r = listaResp[i];
      const h=14;
      npi(h);
      cell(xR[0],wR[0],h,(r&&r.persona&&r.persona.nombre)||'-',{fs:5.5});
      cell(xR[1],wR[1],h,'-',{fs:5.5});
      cell(xR[2],wR[2],h,'-',{fs:5.5});
      pdf.setFillColor(...BL); pdf.setDrawColor(...NE);
      pdf.rect(xR[3],y,wR[3],h,'FD');
      if(r&&r.firmaUrl){
        pdf.setFontSize(4.5); pdf.setTextColor(150,150,150);
        pdf.text('[firma en Drive]', xR[3]+wR[3]/2, y+h/2, {align:'center',baseline:'middle'});
      }
      y+=h;
    }
  }
  y+=3;

  /* ============================================================
     ANEXO 01 — FOTOGRAFÍAS (3 por fila)
     ============================================================ */
  band('Anexo 01. FOTOGRAFÍAS DEL EVENTO (Evidencias / Reconstrucción del accidente)');
  {
    /* Mínimo 3 casillas visibles, aunque estén vacías */
    const fotos=c.fotosInvestigacion||[];
    const fotosAMostrar = fotos.length ? fotos : [null,null,null];
    {
      for(let i=0;i<fotosAMostrar.length;i+=3){
        const grupo=fotosAMostrar.slice(i,i+3);
        const cw=(W-2*4)/3;
        const fh=50;
        npi(fh+8);
        grupo.forEach((f,j)=>{
          const x=M+j*(cw+4);
          pdf.setFillColor(...BL); pdf.setDrawColor(...NE);
          pdf.rect(x,y,cw,fh,'FD');
          pdf.setFontSize(5); pdf.setTextColor(150,150,150);
          pdf.text(f?('[imagen: '+(f.nombre||'')+']'):'', x+cw/2, y+fh/2, {align:'center',baseline:'middle'});
          pdf.setFontSize(5); pdf.setTextColor(...NE);
          if(f){
            const descLines=pdf.splitTextToSize(f.descripcion||'', cw-4);
            descLines.forEach((line,k)=>{
              pdf.text(line, x+2, y+fh+4+k*2.5);
            });
          }
        });
        y+=fh+8;
      }
    }
  }
  y+=3;

  /* ============================================================
     ANEXO 02 — sin cambios
     ============================================================ */
  band('Anexo 02. MANIFESTACIONES DE TESTIGOS');
  npi(6); cell(M,W,6,'Ver archivo(s) adjunto(s) en el expediente digital del caso.',{fs:6}); y+=6;
  y+=3;

  /* ============================================================
     ANEXO 03 — un solo cuadro, numerado en línea "1. 2. 3."
     ============================================================ */
  band('Anexo 03. DOCUMENTOS DE ATENCIÓN MÉDICA');
  {
    const nombres = c.documentosMedicosNombres || ['Receta médica','Constancia SCTR','Informe médico'];
    const texto = nombres.length
      ? nombres.map((n,i)=>(i+1)+'. '+n).join('   ')
      : 'Ver archivos adjuntos.';
    npi(6);
    cell(M,W,6,texto,{fs:5.5,left:true});
    y+=6;
  }

  /* ============================================================
     ANEXO 04 — ANÁLISIS DE CAUSA RAÍZ (tabla de 7 columnas)
     Altura dinámica por N° de líneas (misma regla que Medidas Correctivas).
     ============================================================ */
  {
    const totalFilasCausaRaiz = catsCount_(c);
    npi(6 + totalFilasCausaRaiz*9 + 3);
  }
  band('Anexo 04. ANÁLISIS DE CAUSA RAÍZ');
  {
    const wCol=[24,24,24,24,24,24,50];
    const xCol=[]; let acc=M; wCol.forEach(v=>{xCol.push(acc); acc+=v;});
    const h=6;

    npi(h);
    ['CAUSA IDENTIFICADA\\n(AS, CS, FP, FT)','Por qué 01','Por qué 02','Por qué 03','Por qué 04','Por qué 05','CAUSA RAÍZ IDENTIFICADA'].forEach((s,i)=>{
      cell(xCol[i],wCol[i],h,s,{bg:PL,bold:true,fs:4.2});
    });
    y+=h;

    const catsRef=[
      {k:'actos',abrev:'AS'},{k:'condiciones',abrev:'CS'},
      {k:'factoresPersonales',abrev:'FP'},{k:'factoresTrabajo',abrev:'FT'}
    ];

    catsRef.forEach(cat=>{
      (c.scat[cat.k]||[]).forEach((item,i)=>{
        const analisis=c.analisisCausaRaiz[item.id];
        if(!analisis) return;

        const etiqueta=cat.abrev+' '+String(i+1).padStart(2,'0');
        const porques=analisis.porques.map(p=>p.texto||'');
        const raiz = analisis.porques.find(p=>p.esRaiz===true);
        const raizTxt = raiz ? raiz.texto : '-';

        /* Altura dinámica: máximo N° de líneas entre los 5 "por qué" y la causa raíz */
        pdf.setFont('helvetica','normal');
        let maxLineas=1;
        for(let k=0;k<5;k++){
          pdf.setFontSize(4.4);
          const lns=pdf.splitTextToSize(String(porques[k]||''), Math.max(3,wCol[1+k]-2.5));
          maxLineas=Math.max(maxLineas,lns.length);
        }
        pdf.setFontSize(4.2);
        const lnsRaiz=pdf.splitTextToSize(String(raizTxt), Math.max(3,wCol[6]-2.5));
        maxLineas=Math.max(maxLineas,lnsRaiz.length);

        const hh=alturaPorLineas_(maxLineas);
        npi(hh);
        cell(xCol[0],wCol[0],hh,etiqueta,{fs:4.4,bold:true});
        for(let k=0;k<5;k++){
          cell(xCol[1+k],wCol[1+k],hh, porques[k]||'', {fs:4.4,left:true});
        }
        cell(xCol[6],wCol[6],hh,raizTxt,{fs:4.2,left:true,bold:true,bg:[228,242,236]});
        y+=hh;
      });
    });
  }
  y+=3;


  } // fin de construirContenido()

  /* ============================================================
     DOBLE PASADA:
     1) generación silenciosa solo para contar páginas reales.
     2) generación final, ahora con TOTAL_PAG ya conocido, así el
        header nunca necesita "borrar y redibujar" (eso era lo que
        cortaba la línea de fecha).
     ============================================================ */
  crearPdf();
  construirContenido();
  TOTAL_PAG = pdf.internal.getNumberOfPages();

  crearPdf();
  construirContenido();

  const blob=pdf.output('blob');
  const url=URL.createObjectURL(blob);

  /* Descarga forzada real (no depende de que el navegador permita popups) */
  const a=document.createElement('a');
  a.href=url;
  a.download=nombrePDFInvestigacion(datos.caso);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  /* Vista previa en pestaña nueva — puede ser bloqueada por el navegador, no es crítico */
  try{ window.open(url,'_blank'); }catch(e){}

  document.getElementById('info').textContent=
    'PDF generado: '+nombrePDFInvestigacion(datos.caso)+' — diseño F013 actualizado';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expediente</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* =========================================================
   FLASH REPORT — ESTILOS
   ========================================================= */
.frSection { margin-top:22px }
.frSection:first-child { margin-top:0 }
.frSectionHead {
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px
}
.frSectionHead h2 { margin:0;font-size:16px;color:var(--azul) }
.frSectionHead span { font-size:11px;color:var(--muted) }

.frGrid2 { display:grid;grid-template-columns:1fr 1fr;gap:14px }
.frGrid3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px }
.frGrid4 { display:grid;grid-template-columns:repeat(4,1fr);gap:14px }

/* Campo base — mismo estilo visual que la plataforma */
.frField { min-width:0 }
.frField label {
  display:block;font-size:11px;font-weight:700;
  color:var(--muted);margin-bottom:6px
}
.frField input,
.frField select,
.frField textarea {
  width:100%;box-sizing:border-box;
  height:44px;border:1px solid var(--borde);border-radius:9px;
  background:#fff;padding:0 12px;color:var(--texto);
  font-size:14px;font-family:inherit
}
.frField textarea {
  height:auto;min-height:130px;resize:vertical;
  padding:11px 12px;line-height:1.5
}
.frField input:focus,
.frField select:focus,
.frField textarea:focus { outline:0;border-color:var(--azul) }

/* Solo lectura */
.frReadonly {
  background:#f3f7f6 !important;
  color:var(--texto) !important;
  cursor:not-allowed
}

.frHint { font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4 }

/* Radio pills */
.frRadioGroup { display:flex;flex-wrap:wrap;gap:10px }
.frRadio {
  display:flex;align-items:center;gap:7px;
  padding:10px 16px;border:1px solid var(--borde);
  border-radius:9px;cursor:pointer;background:#fff;font-size:13px
}
.frRadio:hover { background:#f7faf9 }
.frRadio input { width:auto;height:auto;border:none;border-radius:0;padding:0 }

/* Condicional */
.frConditional { display:none }
.frConditional.on { display:block }

/* Modo buscar / manual */
.frMode { display:flex;gap:8px;margin-bottom:10px }
.frMode button {
  border:1px solid var(--borde);background:#fff;color:var(--muted);
  border-radius:8px;padding:7px 11px;font-size:11px;
  cursor:pointer;font-family:inherit
}
.frMode button.on {
  background:#f3f7f6;color:var(--azul);
  border-color:var(--azul);font-weight:700
}

/* Buscador */
.frSearch { position:relative }
.frSearchBar { display:grid;grid-template-columns:1fr auto;gap:8px }
.frSearchBar input {
  height:44px;border:1px solid var(--borde);border-radius:9px;
  background:#fff;padding:0 12px;color:var(--texto);
  font-size:14px;font-family:inherit;width:100%;box-sizing:border-box
}
.frSearchBar input:focus { outline:0;border-color:var(--azul) }
.frSearchResults {
  position:absolute;z-index:100;left:0;right:0;top:calc(100% + 5px);
  background:#fff;border:1px solid var(--borde);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
  max-height:260px;overflow:auto;display:none
}
.frSearchResults.on { display:block }
.frSearchItem {
  padding:11px 13px;border-bottom:1px solid #edf0ee;cursor:pointer
}
.frSearchItem:last-child { border-bottom:0 }
.frSearchItem:hover { background:#f3f7f6 }
.frSearchItem strong { display:block;color:var(--texto);font-size:12px }
.frSearchItem span { display:block;color:var(--muted);font-size:10px;margin-top:3px }

/* Persona seleccionada */
.frSelectedChip {
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:11px 13px;background:#e4f2ec;
  border:1px solid var(--verde);border-radius:9px;margin-top:8px
}
.frSelectedChip strong { font-size:13px;color:#1f5c48 }
.frSelectedChip span { font-size:11px;color:#1f5c48;margin-top:2px;display:block }
.frSelectedChip button {
  border:0;background:transparent;color:var(--azul);
  font-size:12px;cursor:pointer;font-weight:700;white-space:nowrap
}

/* Trabajador solo lectura */
.frPersonLocked {
  border:1px solid var(--borde);border-radius:11px;
  padding:14px;margin-bottom:11px;background:#f3f7f6
}
.frPersonLockedHead { margin-bottom:12px }
.frPersonLockedHead strong { display:block;font-size:13px;color:var(--texto) }
.frPersonLockedHead span { display:block;font-size:11px;color:var(--muted);margin-top:3px }

/* Repetibles */
.frRepeat {
  border:1px solid var(--borde);border-radius:11px;
  padding:14px;margin-bottom:10px;background:#fafbf9
}
.frRepeatHead {
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:12px
}
.frRepeatHead strong { font-size:12px;color:var(--azul) }
.frMiniBtn {
  border:1px solid var(--borde);background:#fff;color:var(--azul);
  border-radius:7px;padding:5px 8px;font-size:11px;
  cursor:pointer;font-family:inherit
}
.frMiniBtn.danger { color:var(--rojo) }
.frAdd { margin-top:8px }

/* Fotos */
.frPhotoZone {
  border:1.5px dashed #b7c5c1;border-radius:11px;padding:23px;
  text-align:center;cursor:pointer;background:#fafbf9;transition:.2s
}
.frPhotoZone:hover { border-color:var(--azul);background:#f3f7f6 }
.frPhotoZone strong { display:block;font-size:13px;color:var(--azul) }
.frPhotoZone span { display:block;font-size:11px;color:var(--muted);margin-top:5px }
.frPhotos {
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-top:14px
}
.frPhoto {
  position:relative;border:1px solid var(--borde);border-radius:9px;
  overflow:hidden;background:#fff;aspect-ratio:4/3;cursor:grab
}
.frPhoto.dragging { opacity:.45 }
.frPhoto.dragover { outline:2px solid var(--azul);outline-offset:-2px }
.frPhoto img { width:100%;height:100%;object-fit:cover;display:block }
.frPhotoNumber {
  position:absolute;top:6px;left:6px;min-width:24px;height:24px;
  border-radius:50%;display:grid;place-items:center;
  background:var(--azul);color:#fff;font-size:10px;font-weight:700
}
.frPhotoDel {
  position:absolute;right:6px;top:6px;width:25px;height:25px;
  border:0;border-radius:50%;background:var(--rojo);color:#fff;
  cursor:pointer;font-weight:700
}
.frPhotoTools { position:absolute;left:6px;bottom:6px;display:flex;gap:4px }
.frPhotoTools button {
  width:26px;height:26px;border:0;border-radius:50%;
  background:var(--azul);color:#fff;cursor:pointer;font-weight:700
}

/* Firma */
.frFirma { display:flex;align-items:center;gap:14px;flex-wrap:wrap }
.frFirmaPreview {
  width:180px;height:75px;border:1.5px dashed #b7c5c1;border-radius:9px;
  display:grid;place-items:center;background:#fafbf9;
  color:var(--muted);font-size:11px;overflow:hidden
}
.frFirmaPreview img { max-width:170px;max-height:65px;object-fit:contain }

/* Avisos */
.frNotice {
  padding:13px 16px;border-radius:9px;
  margin-bottom:16px;font-size:12px;line-height:1.55
}
.frNotice.info { background:#f3f7f6;border-left:4px solid var(--azul);color:var(--azul) }
.frNotice.warn { background:#fdf8ec;border-left:4px solid #d9b262;color:#6b5a30 }
.frNotice.ok   { background:#e4f2ec;border-left:4px solid var(--verde);color:#1f5c48 }

/* Acciones */
.frActions {
  display:flex;flex-wrap:wrap;gap:9px;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--borde)
}
.frActions button { min-height:40px }
.frSend { min-width:210px }

/* Modal PDF */
.frPdfModal {
  display:none;position:fixed;inset:0;z-index:10000;
  background:rgba(0,0,0,.55);padding:18px
}
.frPdfModal.on { display:flex;align-items:center;justify-content:center }
.frPdfBox {
  width:min(1100px,96vw);height:min(92vh,900px);
  background:#fff;border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 18px 55px rgba(0,0,0,.25)
}
.frPdfHead {
  background:var(--azul);color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between
}
.frPdfHead strong { font-size:13px }
.frPdfClose {
  border:0;background:transparent;color:#fff;
  font-size:25px;cursor:pointer
}
.frPdfView { flex:1;min-height:0;background:#525659 }
.frPdfView iframe { width:100%;height:100%;border:0 }
.frPdfFoot {
  display:flex;justify-content:flex-end;gap:9px;
  padding:10px 14px;border-top:1px solid var(--borde)
}

@media(max-width:900px){
  .frGrid4,.frGrid3 { grid-template-columns:1fr 1fr }
}
@media(max-width:650px){
  .frGrid2,.frGrid3,.frGrid4 { grid-template-columns:1fr }
  .frPhotos { grid-template-columns:1fr }
  .frActions { flex-direction:column }
  .frActions button { width:100% }
}
</style>
</head>

<body>
<script>
  const URL_APP = '<?= urlApp() ?>';
  const PAGINA_ACTUAL = 'Accidentabilidad_Web';
  const ID_CASO = '<?= idCaso ?>';
</script>

<div class="app">
<?!= include('Sidebar') ?>
<main class="main">

<header class="topbar">
  <div class="crumb">Accidentabilidad &nbsp;/&nbsp; <strong>Expediente</strong></div>
  <div class="topStatus" id="estado">Cargando...</div>
</header>

<section class="content">
<button class="backBtn" onclick="irA('Accidentabilidad_Web')">← Volver a la lista</button>
<div id="cabecera"></div>
<div class="tabs" id="tabs"></div>
<div class="card">
  <div id="cuerpo"><div class="empty">Cargando expediente...</div></div>
</div>
</section>
</main>
</div>

<div id="toastHost" aria-live="polite"></div>

<!-- Modal PDF -->
<div id="frPdfModal" class="frPdfModal" aria-hidden="true">
  <div class="frPdfBox" role="dialog" aria-modal="true">
    <div class="frPdfHead">
      <strong>Vista previa — Flash Report F034</strong>
      <button class="frPdfClose" onclick="cerrarPreview()">×</button>
    </div>
    <div class="frPdfView">
      <iframe id="frPdfFrame" title="Vista previa"></iframe>
    </div>
    <div class="frPdfFoot">
      <button class="secondary" onclick="cerrarPreview()">Cerrar</button>
      <button class="primary" onclick="descargarPDFGenerado()">Descargar PDF</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const $ = id => document.getElementById(id);

let CASO = null, FLASH = null, CAT = {}, ACTIVA = 'datos';

// Estado del formulario Flash
let FR = {
  responsableAreaModo: 'buscar',
  responsableArea: null,       // {nombre, manual}
  supervisorModo: 'buscar',
  supervisor: null,            // {nombre, manual}
  testigoModo: [],             // 'buscar'|'manual' por índice
  vehiculos: [],
  testigos: [],                // [{nombre}]
  fotos: [],
  firma: null,
  firmaRatio: 2,
  enviado: false               // true solo cuando el correo fue enviado OK
};

// Resultados temporales de búsqueda
let RES = {
  respArea: [],
  supervisor: [],
  testigo: {}    // clave=índice testigo
};

let PDF_BLOB = null, PDF_URL = null;

/* =========================================================
   TABS
   ========================================================= */
const TABS = [
  {k:'datos',    s:'DATOS',         t:'Datos'},
  {k:'flash',    s:'FLASH',         t:'Flash Report'},
  {k:'descanso', s:'DESCANSO',      t:'Descanso'},
  {k:'inv',      s:'INVESTIGACION', t:'Investigación'},
  {k:'acciones', s:'ACCIONES',      t:'Medidas'},
  {k:'comite',   s:'COMITE',        t:'Comité'},
  {k:'leccion',  s:'LECCION',       t:'Lección'}
];

function cargar(){
  if(!ID_CASO){
    $('estado').textContent='Sin caso';
    $('cuerpo').innerHTML='<div class="empty">No se indicó el caso.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(d=>{
      CASO = d.caso; FLASH = d.flash; CAT = d;
      FR.enviado = !!(FLASH && FLASH.archivo);
      $('estado').textContent = CASO.estado||'ABIERTO';
      pintarCabecera(); pintarTabs(); pintarCuerpo();
    })
    .withFailureHandler(e=>{
      const m=(e&&e.message)||'';
      $('estado').textContent = m==='SIN_ACCESO'?'Sin acceso':'Error';
      $('cuerpo').innerHTML='<div class="empty">'+esc(m==='SIN_ACCESO'
        ?'No tienes acceso a este caso.':(m||'Error'))+'</div>';
    })
    .accObtenerFlash(TOKEN, ID_CASO);
}

function pintarCabecera(){
  const e=CASO.evento||{}, g=CASO.involucrados||[];
  $('cabecera').innerHTML=`
    <div class="caseHead">
      <h1>${esc(CASO.codigo||'Código pendiente')}</h1>
      <div class="caseMeta">
        ${esc(CASO.sociedad)}${CASO.ruc?' · RUC '+esc(CASO.ruc):''}
        <br>${esc(e.proyecto||'')} · ${esc(e.fecha||'')}${e.hora?' · '+esc(e.hora):''}
        <br>${esc(e.lugar||'')}
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        ${g.map(i=>`<span class="tag">${esc(i.nombre)}${i.gravedad?' · '+esc(i.gravedad):''}</span>`).join('')}
      </div>
      <div class="accMini" style="width:100%;margin-top:16px">
        <i style="width:${CASO.avance||0}%"></i>
      </div>
      <div class="accPct">${CASO.avance||0}% del expediente</div>
    </div>`;
}

function pintarTabs(){
  const p=CASO.permisos||{};
  $('tabs').innerHTML=TABS.map(t=>{
    const bloq=p[t.s]===false;
    // Check verde SOLO si el flash fue enviado por correo y tiene PDF adjunto
    const check = t.k==='flash' && FR.enviado;
    return `<button class="tab ${t.k===ACTIVA?'on':''}" onclick="tab('${t.k}')">
      ${t.t}${check?' <i>✓</i>':''}${bloq?' <span style="opacity:.5">🔒</span>':''}
    </button>`;
  }).join('');
}

function tab(k){ ACTIVA=k; pintarTabs(); pintarCuerpo(); }

function pintarCuerpo(){
  if(ACTIVA==='datos') return pintarDatos();
  if(ACTIVA==='flash') return pintarFlash();
  const t=TABS.find(x=>x.k===ACTIVA);
  const p=CASO.permisos||{};
  $('cuerpo').innerHTML=`<div class="soon"><strong>${t.t}</strong><br><br>${
    p[t.s]===false
      ?'No tienes permiso para editar esta sección.'
      :'Esta sección se habilitará en la siguiente etapa.'
  }</div>`;
}

/* =========================================================
   PESTAÑA DATOS
   ========================================================= */
function pintarDatos(){
  const e=CASO.evento||{};
  $('cuerpo').innerHTML=`
    <div class="cardTitle"><h2>Datos del evento</h2><span>Registro inicial</span></div>
    <dl class="dl">
      <dt>Código</dt><dd>${esc(CASO.codigo||'Se genera con el Flash Report')}</dd>
      <dt>Tipo</dt><dd>${esc(CASO.tipo||'Se define en el Flash Report')}</dd>
      <dt>Sociedad</dt><dd>${esc(CASO.sociedad)} (${esc(CASO.sigla)})</dd>
      <dt>RUC</dt><dd>${esc(CASO.ruc||'—')}</dd>
      <dt>Fecha y hora</dt><dd>${esc(e.fecha||'')} ${esc(e.hora||'')}</dd>
      <dt>Turno</dt><dd>${esc(e.turno||'—')}</dd>
      <dt>Proyecto</dt><dd>${esc(e.proyecto||'')}</dd>
      <dt>Lugar exacto</dt><dd>${esc(e.lugar||'')}</dd>
      <dt>Registrado por</dt>
      <dd>${esc(e.registradoPor||'')}
          <br><span style="color:var(--muted);font-size:12px">${esc(e.registradoCorreo||'')}</span></dd>
      <dt>Etapa actual</dt><dd>${esc(CASO.etapa)}</dd>
    </dl>
    <div class="cardTitle" style="margin:26px 0 16px">
      <h2>Involucrados</h2><span>${(CASO.involucrados||[]).length}</span>
    </div>
    <table class="accTable"><thead><tr>
      <th>NOMBRE</th><th>DOCUMENTO</th><th>CARGO</th>
      <th>GRAVEDAD</th><th>INVESTIGACIÓN</th>
    </tr></thead><tbody>
    ${(CASO.involucrados||[]).map(i=>`<tr style="cursor:default">
      <td><strong>${esc(i.nombre)}</strong></td>
      <td>${esc(i.dni)}</td>
      <td>${esc(i.cargo||'—')}</td>
      <td>${i.gravedad
        ?'<span class="tag">'+esc(i.gravedad)+(i.grado?' · '+esc(i.grado):'')+' </span>'
        :'<span class="accPeople">Se define en el Flash Report</span>'}</td>
      <td><span class="tag gray">${esc(i.estadoInv)}</span></td>
    </tr>`).join('')}
    </tbody></table>`;
}

/* =========================================================
   FLASH REPORT — RENDER PRINCIPAL
   ========================================================= */
function pintarFlash(){
  const puede = CAT.puedeEditar && CASO.permisos && CASO.permisos.FLASH!==false;
  const dis = puede ? '' : ' disabled';
  cargarFirmaLocal();

  $('cuerpo').innerHTML =
    renderEstado(puede) +
    renderSec1(dis) +
    renderSec2() +
    renderSec3(dis) +
    renderSec4(dis) +
    renderSec5(dis) +
    renderSec6(dis) +
    renderAcciones(puede);

  activarEventos();
  if(FLASH) cargarGuardados();
  pintarVehiculos();
  pintarTestigos();
  pintarFotos();
  pintarFirma();
  pintarRespArea();
  pintarSupervisor();
}

/* ── Estado / aviso superior ── */
function renderEstado(puede){
  if(!FR.enviado){
    // Borrador — puede haber datos guardados pero aún no enviado con PDF
    if(FLASH){
      return `<div class="frNotice warn">
        <strong>Borrador guardado.</strong><br>
        El Flash Report tiene datos guardados pero aún no se ha enviado por correo.
        Revisa y usa <b>Enviar Flash Report</b> cuando esté listo.
      </div>`;
    }
    return `<div class="frNotice info">
      <strong>Flash Report pendiente.</strong><br>
      Completa el Formato 34. Puedes guardar el borrador en cualquier momento.
    </div>`;
  }
  return `<div class="frNotice ok">
    <strong>Flash Report enviado.</strong><br>
    El documento fue enviado por correo y adjuntado al expediente.
    ${FLASH&&FLASH.archivo?'<br><a href="'+esc(FLASH.archivo)+'" target="_blank" style="color:var(--verde);font-weight:700">Ver PDF adjunto</a>':''}
  </div>`;
}

/* ── Sección 1 ── */
function renderSec1(dis){
  const tipoPrincipal = (FLASH&&FLASH.tipoPrincipal)||'';
  const clasificacion = (FLASH&&FLASH.gravedad)||'';
  return `
  <div class="frSection">
    <div class="frSectionHead"><h2>1. Información general</h2></div>

    <!-- Tipo -->
    <div class="frField" style="margin-bottom:16px">
      <label>TIPO DE ACCIDENTE / INCIDENTE *</label>
      <div class="frRadioGroup">
        <label class="frRadio">
          <input type="radio" name="frTipo" value="ACCIDENTE"
            ${tipoPrincipal==='ACCIDENTE'?'checked':''} ${dis}> Accidente
        </label>
        <label class="frRadio">
          <input type="radio" name="frTipo" value="INCIDENTE"
            ${tipoPrincipal==='INCIDENTE'?'checked':''} ${dis}> Incidente
        </label>
      </div>
    </div>

    <!-- Clasificación (solo accidente) -->
    <div id="frClasWrap" class="frConditional${tipoPrincipal==='ACCIDENTE'?' on':''}"
         style="margin-bottom:16px">
      <div class="frGrid2">
        <div class="frField">
          <label>CLASIFICACIÓN</label>
          <select id="frClasificacion" ${dis}>
            <option value="">Seleccionar...</option>
            <option value="LEVE"${clasificacion==='LEVE'?' selected':''}>Leve</option>
            <option value="INCAPACITANTE"${clasificacion==='INCAPACITANTE'?' selected':''}>Incapacitante</option>
            <option value="MORTAL"${clasificacion==='MORTAL'?' selected':''}>Mortal</option>
          </select>
        </div>
        <div class="frField frConditional${clasificacion==='INCAPACITANTE'?' on':''}"
             id="frGradoWrap">
          <label>GRADO DE INCAPACIDAD</label>
          <select id="frGrado" ${dis}>
            <option value="">Seleccionar...</option>
            <option value="TOTAL TEMPORAL">Total temporal</option>
            <option value="PARCIAL TEMPORAL">Parcial temporal</option>
            <option value="PARCIAL PERMANENTE">Parcial permanente</option>
            <option value="TOTAL PERMANENTE">Total permanente</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Gerencia / Responsable de área -->
    <div class="frField">
      <label>GERENCIA / RESPONSABLE DEL PROYECTO / ÁREA *</label>
      ${renderBuscador('respArea', dis, 'Buscar por nombre, DNI o ID SAP...')}
    </div>
  </div>`;
}

/* ── Sección 2: Trabajadores solo lectura ── */
function renderSec2(){
  const inv=CASO.involucrados||[];
  return `
  <div class="frSection">
    <div class="frSectionHead">
      <h2>2. Datos del trabajador(es) afectado(s)</h2>
      <span>${inv.length} involucrado(s)</span>
    </div>
    ${inv.map((p,i)=>`
      <div class="frPersonLocked">
        <div class="frPersonLockedHead">
          <strong>${esc(p.nombre||'')}</strong>
          <span>DNI: ${esc(p.dni||'—')}${p.idSap?' · ID SAP: '+esc(p.idSap):''}</span>
        </div>
        <div class="frGrid3">
          <div class="frField">
            <label>PUESTO / CARGO</label>
            <input class="frReadonly" readonly value="${esc(p.cargo||'')}">
          </div>
          <div class="frField">
            <label>EMPRESA</label>

function cambiarModo(clave, modo){
  const modoKey = clave==='respArea'?'responsableAreaModo':'supervisorModo';
  FR[modoKey]=modo;
  $('frBtn_'+clave+'_buscar').classList.toggle('on', modo==='buscar');
  $('frBtn_'+clave+'_manual').classList.toggle('on', modo==='manual');
  $('frBox_'+clave+'_buscar').style.display=modo==='buscar'?'block':'none';
  $('frBox_'+clave+'_manual').style.display=modo==='manual'?'block':'none';
  if(modo==='manual'){
    if(clave==='respArea') FR.responsableArea=null;
    else FR.supervisor=null;
  }
}

function buscarPersona(clave){
  const q=$('frQ_'+clave);
  if(!q||!q.value.trim()){ toast('Escribe un nombre para buscar.',true); return; }
  const box=$('frRes_'+clave);
  box.classList.add('on');
  box.innerHTML='<div style="padding:12px;font-size:12px;color:var(--muted)">Buscando...</div>';
  google.script.run
    .withSuccessHandler(r=>{
      RES[clave]=r||[];
      if(!RES[clave].length){
        box.innerHTML='<div style="padding:12px;font-size:12px;color:var(--muted)">Sin resultados.</div>';
        return;
      }
      box.innerHTML=RES[clave].map((p,i)=>`
        <div class="frSearchItem" onclick="seleccionarPersona('${clave}',${i})">
          <strong>${esc(p.nombre)}</strong>
          <span>${esc(p.dni||'—')} · ${esc(p.sigla||'')} · ${esc(p.proyecto||'')}</span>
        </div>`).join('');
    })
    .withFailureHandler(e=>{
      box.innerHTML='<div style="padding:12px;font-size:12px;color:var(--muted)">Error en la búsqueda.</div>';
      toast((e&&e.message)||'Error.',true);
    })
    .accBuscarPersonas(TOKEN,{texto:q.value.trim(), estado:'TODOS'});
}

function seleccionarPersona(clave, i){
  const p=RES[clave][i];
  const obj={nombre:p.nombre, manual:false};

/* =========================================================
   FOTOS
   ========================================================= */
function abrirFotos(){ $('frPhotoInput').click(); }

function cargarFotos(e){
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  const max=Math.max(0,9-FR.fotos.length);
  files.slice(0,max).forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        const scale=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
        const c=document.createElement('canvas');
        c.width=Math.round(img.naturalWidth*scale);
        c.height=Math.round(img.naturalHeight*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        FR.fotos.push({
          data:c.toDataURL('image/jpeg',.78),
          nombre:file.name,
          ratio:img.naturalWidth/img.naturalHeight
        });
        pintarFotos();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function pintarFotos(){
  const box=$('frFotos');
  if(!box) return;
  if(!FR.fotos.length){ box.innerHTML=''; return; }
  box.innerHTML=FR.fotos.map((f,i)=>`
    <div class="frPhoto" draggable="true" data-foto-i="${i}">
      <img src="${f.data}" alt="Foto ${i+1}">
      <div class="frPhotoNumber">${i+1}</div>
      <button type="button" class="frPhotoDel" data-foto-del="${i}">×</button>
      <div class="frPhotoTools">
        <button type="button" data-foto-left="${i}">←</button>
        <button type="button" data-foto-right="${i}">→</button>
      </div>
    </div>`).join('');
}

function activarDragFotos(){
  const box=$('frFotos');
  if(!box) return;
  box.addEventListener('dragstart',e=>{
    const it=e.target.closest('[data-foto-i]');
    if(it){ it.classList.add('dragging'); box.dataset.drag=it.dataset.fotoI; }
  });
  box.addEventListener('dragend',e=>{
    e.target.closest('[data-foto-i]')?.classList.remove('dragging');
    box.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));
  });
  box.addEventListener('dragover',e=>{
    const it=e.target.closest('[data-foto-i]');
    if(it){ e.preventDefault(); it.classList.add('dragover'); }
  });
  box.addEventListener('drop',e=>{
    const it=e.target.closest('[data-foto-i]');
    if(!it) return; e.preventDefault();
    const d=+box.dataset.drag, h=+it.dataset.fotoI;
    if(isNaN(d)||isNaN(h)||d===h) return;
    const [m]=FR.fotos.splice(d,1);
    FR.fotos.splice(h,0,m);
    pintarFotos();
  });
  box.addEventListener('click',e=>{
    const del=e.target.closest('[data-foto-del]');
    if(del){ FR.fotos.splice(+del.dataset.fotoDel,1); pintarFotos(); return; }
    const left=e.target.closest('[data-foto-left]');
    if(left){
      const i=+left.dataset.fotoLeft;
      if(i>0){[FR.fotos[i-1],FR.fotos[i]]=[FR.fotos[i],FR.fotos[i-1]];pintarFotos();}
      return;
    }
    const right=e.target.closest('[data-foto-right]');
    if(right){
      const i=+right.dataset.fotoRight;
      if(i<FR.fotos.length-1){[FR.fotos[i],FR.fotos[i+1]]=[FR.fotos[i+1],FR.fotos[i]];pintarFotos();}
    }
  });
}

/* =========================================================

   ========================================================= */
function abrirFirma(){ $('frFirmaInput').click(); }

function cargarFirma(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      FR.firmaRatio=img.naturalWidth/img.naturalHeight;
      FR.firma=ev.target.result;
      try{
        localStorage.setItem('f034_firma',FR.firma);
        localStorage.setItem('f034_ratio',FR.firmaRatio);
      }catch(e){}
      pintarFirma(); toast('Firma cargada');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function cargarFirmaLocal(){
  try{
    FR.firma=localStorage.getItem('f034_firma')||null;
    FR.firmaRatio=parseFloat(localStorage.getItem('f034_ratio'))||2;
  }catch(e){ FR.firma=null; FR.firmaRatio=2; }
}

function pintarFirma(){
  const box=$('frFirmaPreview'), btn=$('frFirmaEliminar');
  if(!box) return;
  if(!FR.firma){ box.textContent='Sin firma'; if(btn) btn.style.display='none'; return; }
  box.innerHTML='<img src="'+esc(FR.firma)+'">';
  if(btn) btn.style.display='inline-block';
}

function eliminarFirma(){
  FR.firma=null; FR.firmaRatio=2;
  if($('frFirmaInput')) $('frFirmaInput').value='';
  try{
    localStorage.removeItem('f034_firma');
    localStorage.removeItem('f034_ratio');
  }catch(e){}
  pintarFirma();
}

/* =========================================================

   ========================================================= */
function activarEventos(){
  document.querySelectorAll('input[name="frTipo"]').forEach(el=>{
    el.addEventListener('change', ()=>{ actualizarTipo(); });
  });
  actualizarTipo();
  const clas=$('frClasificacion');
  if(clas) clas.addEventListener('change', actualizarGrado);

  const pi=$('frPhotoInput');
  if(pi) pi.addEventListener('change', cargarFotos);
  const fi=$('frFirmaInput');
  if(fi) fi.addEventListener('change', cargarFirma);

  activarDragFotos();
}

function actualizarTipo(){
  const tipo=obtenerTipo();
  const wrap=$('frClasWrap');
  if(wrap) wrap.classList.toggle('on', tipo==='ACCIDENTE');
  if(tipo!=='ACCIDENTE'){
    if($('frClasificacion')) $('frClasificacion').value='';
    if($('frGrado')) $('frGrado').value='';
    if($('frGradoWrap')) $('frGradoWrap').classList.remove('on');
  }
}

function actualizarGrado(){
  const tipo=obtenerTipo();
  const clas=$('frClasificacion')?$('frClasificacion').value:'';
  const wrap=$('frGradoWrap');
  if(wrap) wrap.classList.toggle('on', tipo==='ACCIDENTE'&&clas==='INCAPACITANTE');
}

function obtenerTipo(){
  const el=document.querySelector('input[name="frTipo"]:checked');
  return el?el.value:'';
}

   CARGAR DATOS GUARDADOS (borrador o flash completo)
   ========================================================= */
function cargarGuardados(){
  if(!FLASH) return;
  if($('frDescripcion')) $('frDescripcion').value=FLASH.descripcion||'';
  if($('frDano')) $('frDano').value=FLASH.dano||FLASH.danoCausado||'';
  if($('frClasificacion')) $('frClasificacion').value=FLASH.gravedad||'';
  if($('frGrado')) $('frGrado').value=FLASH.grado||'';

  // Supervisor (puede venir como string o como objeto)
  if(FLASH.supervisor){
    if(typeof FLASH.supervisor==='object'){
      FR.supervisor=FLASH.supervisor;
    } else {
      FR.supervisor={nombre:FLASH.supervisor, manual:true};
      FR.supervisorModo='manual';
      cambiarModo('supervisor','manual');
      if($('frManual_supervisor')) $('frManual_supervisor').value=FLASH.supervisor;
    }
    pintarSupervisor();
    if($('frQ_supervisor')&&FR.supervisor) $('frQ_supervisor').value=FR.supervisor.nombre||'';
  }

  const tipoEl=document.querySelector(`input[name="frTipo"][value="${FLASH.tipoPrincipal||''}"]`);
  if(tipoEl) tipoEl.checked=true;
  actualizarTipo(); actualizarGrado();

  if(FLASH.responsableArea){
    FR.responsableArea=typeof FLASH.responsableArea==='object'
      ?FLASH.responsableArea
      :{nombre:FLASH.responsableArea, manual:true};
    if($('frQ_respArea')) $('frQ_respArea').value=FR.responsableArea.nombre||'';
    pintarRespArea();
  }

  if(FLASH.vehiculos&&FLASH.vehiculos.length){
    FR.vehiculos=FLASH.vehiculos;
    pintarVehiculos();
  }
  if(FLASH.testigos&&FLASH.testigos.length){
    FR.testigos=FLASH.testigos.map(t=>({nombre:typeof t==='string'?t:(t.nombre||'')}));
    FR.testigoModo=FR.testigos.map(()=>'buscar');
    pintarTestigos();
  }
  pintarFirma();
}

/* =========================================================
   VALIDAR
   ========================================================= */
function validarFlash(){
  const tipo=obtenerTipo();
  if(!tipo){ toast('Selecciona Accidente o Incidente.',true); return false; }
  const clas=$('frClasificacion')?$('frClasificacion').value:'';
  if(tipo==='ACCIDENTE'&&!clas){ toast('Selecciona la clasificación.',true); return false; }
  if(tipo==='ACCIDENTE'&&clas==='INCAPACITANTE'){
    if(!$('frGrado')||!$('frGrado').value){ toast('Indica el grado de incapacidad.',true); return false; }
  }
  if(!$('frDescripcion')||!$('frDescripcion').value.trim()){ toast('Describe lo ocurrido.',true); return false; }
  if(!$('frResponsable')||!$('frResponsable').value){ toast('Selecciona el responsable del registro.',true); return false; }
  // Gerencia: al menos un nombre
  const respAreaNombre = obtenerNombreRespArea();
  if(!respAreaNombre){ toast('Indica el responsable de área.',true); return false; }
  return true;
}

function obtenerNombreRespArea(){
  if(FR.responsableAreaModo==='manual'){
    return ($('frManual_respArea')&&$('frManual_respArea').value.trim())||'';
  }
  if(FR.responsableArea) return FR.responsableArea.nombre||'';
  return ($('frQ_respArea')&&$('frQ_respArea').value.trim())||'';
}

function obtenerNombreSupervisor(){
  if(FR.supervisorModo==='manual'){
    return ($('frManual_supervisor')&&$('frManual_supervisor').value.trim())||'';
  }
  if(FR.supervisor) return FR.supervisor.nombre||'';
  return ($('frQ_supervisor')&&$('frQ_supervisor').value.trim())||'';
}

/* =========================================================
   RECOGER DATOS
   ========================================================= */
function recogerDatos(){
  const e=CASO.evento||{};
  const trabajadores=(CASO.involucrados||[]).map((p,i)=>({
    idInvolucrado:p.idInvolucrado||'',
    idSap:p.idSap||'',
    dni:p.dni||'',
    nombre:p.nombre||'',
    cargo:p.cargo||'',
    empresa:p.sociedad||CASO.sociedad||'',
    area:$('frInvArea'+i)?$('frInvArea'+i).value.trim():(p.area||'')
  }));

  return {
    idCaso:ID_CASO,
    // Datos del evento — vienen de CASO.evento, no del formulario
    fecha:e.fecha||'',
    hora:e.hora||'',
    proyecto:e.proyecto||'',
    lugar:e.lugar||'',
    empresa:CASO.sociedad||'',
    // Datos del formulario
    tipo:obtenerTipo()==='ACCIDENTE'?'ACCIDENTE':'INCIDENTE',
    tipoPrincipal:obtenerTipo(),
    clasificacion:$('frClasificacion')?$('frClasificacion').value:'',
    grado:$('frGrado')?$('frGrado').value:'',
    fechaReporte:new Date().toISOString().slice(0,10),
    responsable:$('frResponsable')?$('frResponsable').value:'',
    responsableArea:{nombre:obtenerNombreRespArea(), manual:FR.responsableAreaModo==='manual'},
    trabajadores:trabajadores,
    vehiculos:FR.vehiculos,
    testigos:FR.testigos.map(t=>({nombre:t.nombre||''})),
    supervisor:obtenerNombreSupervisor(),
    dano:$('frDano')?$('frDano').value.trim():'',
    descripcion:$('frDescripcion')?$('frDescripcion').value.trim():'',
    fotos:FR.fotos,
    firma:FR.firma,
    firmaRatio:FR.firmaRatio
  };
}

function agregarLogoPDF(pdf, y){
  // if(typeof LOGO_BASE64!=='undefined'){
pdf.addImage('data:image/png;base64,'+LOGO_BASE64,'PNG',8,y,34,7.45);
  // }
}

function fechaDMY(v){
  // Entrada: YYYY-MM-DD → salida: YYYY-MM-DD (formato solicitado)
  return String(v||'');
}

function hora12(v){
  if(!v) return '';
  const p=String(v).split(':');
  let h=Number(p[0]); const m=p[1]||'00';
  const ap=h>=12?'P.M.':'A.M.';
  h=h%12||12;
  return String(h).padStart(2,'0')+':'+m+' '+ap;
}

function nombrePDF(){ return (CASO.codigo||'FLASH-REPORT')+' - Flash Report.pdf'; }

async function generarPDF(descargar=true){
  if(!window.jspdf||!window.jspdf.jsPDF){ toast('No se cargó jsPDF.',true); return null; }
  if(!validarFlash()) return null;

  const datos=recogerDatos();
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});

  const AZ=[0,65,84], PL=[225,224,215], NE=[0,0,0], BL=[255,255,255];
  const M=8, W=194, LIM=289;
  let y=8, page=1;

  function header(){
    agregarLogoPDF(pdf,y);
    pdf.setTextColor(...NE);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10);
    pdf.text('REPORTE PRELIMINAR DE',105,y+5,{align:'center'});
    pdf.text('ACCIDENTE E INCIDENTE - FLASH REPORT',105,y+10,{align:'center'});
    pdf.setFont('helvetica','normal'); pdf.setFontSize(5.5);
    pdf.text('CÓDIGO: SGSST_INDRAGROUP_F 034',202,y+2,{align:'right'});
    pdf.text('VERSIÓN: 01',202,y+4.5,{align:'right'});
    // Fecha fija en formato YYYY-MM-DD tal como se solicitó
    pdf.text('FECHA: 2024-12-11',202,y+7,{align:'right'});
    pdf.text('Página: '+page,202,y+9.5,{align:'right'});
    y+=16;
  }

  function npi(h){ if(y+h>LIM){ pdf.addPage(); page++; y=8; header(); } }

  function band(s){
    npi(5);
    pdf.setFillColor(...AZ); pdf.setDrawColor(...NE);
    pdf.rect(M,y,W,5,'FD');
    pdf.setTextColor(...BL); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
    pdf.text(s,M+2,y+3.2);
    y+=5;
  }

  // Celda con centrado vertical real
  function cell(x,w,h,txt,o={}){
    pdf.setFillColor(...(o.bg||BL)); pdf.setDrawColor(...NE);
    pdf.rect(x,y,w,h,'FD');
    pdf.setTextColor(...(o.fg||NE));
    pdf.setFont('helvetica',o.bold?'bold':'normal');
    pdf.setFontSize(o.fs||6);
    const s=String(txt??''); if(!s) return;
    const lines=pdf.splitTextToSize(s,Math.max(3,w-2.5));
    const lh=2.5, tot=(lines.length-1)*lh;
    const sy=y+h/2-tot/2;
    lines.forEach((l,i)=>pdf.text(l, o.left?x+1.5:x+w/2, sy+i*lh,
      {align:o.left?'left':'center', baseline:'middle'}));
  }

  function row(lbl,val,lw){
    lw=lw||48.5; const vw=W-lw, h=5;
    npi(h);
    cell(M,lw,h,lbl,{bg:AZ,fg:BL,bold:true,left:true,fs:6});
    cell(M+lw,vw,h,val||'-',{fs:6,left:true});
    y+=h;
  }

  header();

  /* ── 1. INFORMACIÓN GENERAL ── */
  band('1. INFORMACIÓN GENERAL');

  const tipoTexto = datos.tipoPrincipal==='ACCIDENTE'
    ? 'Accidente de trabajo'+(datos.clasificacion?' '+datos.clasificacion.toLowerCase():'')
      +(datos.grado?' ('+datos.grado.toLowerCase()+')':'')+'.'
    : 'Incidente.';

  row('TIPO DE ACCIDENTE / INCIDENTE:', tipoTexto);
  row('EMPRESA:', datos.empresa);

  const raTexto=(datos.responsableArea&&datos.responsableArea.nombre)||'-';
  row('GERENCIA / RESP. DEL PROYECTO / ÁREA:', raTexto);

  // FECHA y HORA en una misma fila
  const hFH=5, lFecha=55, vFecha=W/2-lFecha, lHora=30, vHora=W/2-lHora;
  npi(hFH);
  cell(M,           lFecha, hFH,'FECHA DE OCURRENCIA:', {bg:AZ,fg:BL,bold:true,left:true,fs:6});
  cell(M+lFecha,    vFecha, hFH, fechaDMY(datos.fecha),  {fs:6,left:true});
  cell(M+W/2,       lHora,  hFH,'HORA:',                 {bg:AZ,fg:BL,bold:true,left:true,fs:6});
  cell(M+W/2+lHora, vHora,  hFH, hora12(datos.hora),     {fs:6,left:true});
  y+=hFH;

  row('PROYECTO:', datos.proyecto);
  row('LUGAR EXACTO DEL EVENTO:', datos.lugar);
  y+=3;

  /* ── 2. TRABAJADORES ── */
  band('2. DATOS DEL TRABAJADOR(ES) AFECTADO(S)');
  const TW=[74,40,40,40], TX=[M,M+74,M+114,M+154];
  npi(5);
  ['NOMBRES Y APELLIDOS','EMPRESA','CARGO / PUESTO','ÁREA'].forEach((s,i)=>{
    cell(TX[i],TW[i],5,s,{bg:PL,bold:true,fs:6});
  });
  y+=5;
  const trabs=datos.trabajadores.length?datos.trabajadores:[{nombre:'-',empresa:'-',cargo:'-',area:'-'}];
  trabs.forEach(p=>{
    npi(5);
    [p.nombre||'-',p.empresa||'-',p.cargo||'-',p.area||'-'].forEach((s,i)=>{
      cell(TX[i],TW[i],5,s,{fs:6,left:true});
    });
    y+=5;
  });
  y+=3;

  /* ── 3. VEHÍCULOS / TESTIGOS / DAÑO ── */
  band('3. VEHÍCULOS, TESTIGOS Y DAÑO');
  const VW=[48.5,48.5,48.5,48.5], VX=[M,M+48.5,M+97,M+145.5];
  npi(5);
  ['MARCA','MODELO','EMPRESA','PLACA'].forEach((s,i)=>{
    cell(VX[i],VW[i],5,s,{bg:PL,bold:true,fs:6});
  });
  y+=5;
  const vehs=datos.vehiculos.length?datos.vehiculos:[{marca:'-',modelo:'-',empresa:'-',placa:'-'}];
  vehs.forEach(v=>{
    npi(5);
    [v.marca||'-',v.modelo||'-',v.empresa||'-',v.placa||'-'].forEach((s,i)=>{
      cell(VX[i],VW[i],5,s,{fs:6,left:true});
    });
    y+=5;
  });

  const wTL=39.5, wTN=9, wTD=W-wTL-wTN, hT=5;
  const tests=datos.testigos.filter(t=>(t.nombre||'').trim());
  if(!tests.length){
    npi(hT);
    cell(M,wTL,hT,'TESTIGOS DEL ACCIDENTE:',{bg:AZ,fg:BL,bold:true,left:true,fs:6});
    cell(M+wTL,wTN,hT,'-',{bg:PL,bold:true,fs:6});
    cell(M+wTL+wTN,wTD,hT,'-',{fs:6});
    y+=hT;
  } else {
    tests.forEach((t,i)=>{
      npi(hT);
      cell(M,wTL,hT,'TESTIGOS DEL ACCIDENTE:',{bg:AZ,fg:BL,bold:true,left:true,fs:6});
      cell(M+wTL,wTN,hT,'N° '+String(i+1).padStart(2,'0'),{bg:PL,bold:true,fs:6});
      cell(M+wTL+wTN,wTD,hT,t.nombre,{fs:6,left:true});
      y+=hT;
    });
  }
  row('SUPERVISOR DE TURNO:', datos.supervisor||'-');
  row('DAÑO CAUSADO:', datos.dano||'-');

  /* ── 4. DESCRIPCIÓN ── */
  y+=3; band('4. BREVE DESCRIPCIÓN DEL EVENTO');
  pdf.setFont('helvetica','normal'); pdf.setFontSize(6.5);
  const desc=datos.descripcion||'-';
  const dlines=pdf.splitTextToSize(desc,W-5);
  let idx=0;
  while(idx<dlines.length){
    const av=LIM-y-4, can=Math.max(1,Math.floor(av/3.4));
    const part=dlines.slice(idx,idx+can), h=part.length*3.4+4;
    npi(h);
    pdf.setFillColor(...BL); pdf.setDrawColor(...NE);
    pdf.rect(M,y,W,h,'FD');
    pdf.setTextColor(...NE);
    part.forEach((s,i)=>pdf.text(s,M+2.5,y+4+i*3.4));
    y+=h; idx+=can;
  }
  y+=3;

  /* ── 5. FOTOGRAFÍAS ── */
  band('5. EVIDENCIA FOTOGRÁFICA');
  function agrupar(lista){
    const g=[]; let gr=[];
    for(const f of lista){
      const hz=(f.ratio||1)>1.05;
      if(!gr.length){ gr=[f]; continue; }
      const lim=(gr.some(x=>(x.ratio||1)>1.05)||hz)?4:5;
      if(gr.length>=lim){ g.push(gr); gr=[f]; }
      else gr.push(f);
      if(gr.length===4&&gr.some(x=>(x.ratio||1)>1.05)){ g.push(gr); gr=[]; }
    }
    if(gr.length) g.push(gr); return g;
  }
  if(!datos.fotos.length){
    npi(52); cell(M,W,52,''); y+=52;
  } else {
    agrupar(datos.fotos).forEach(group=>{
      const n=group.length, cw=(W-3*(n-1))/n;
      const fh=Math.max(38,Math.min(78,Math.max(...group.map(f=>(cw-2)/(f.ratio||1)+2))));
      npi(fh);
      pdf.setFillColor(...BL); pdf.setDrawColor(...NE);
      pdf.rect(M,y,W,fh,'FD');
      group.forEach((f,j)=>{
        const bx=M+j*(cw+3), mW=cw-2, mH=fh-2;
        let w=mW, h=w/(f.ratio||1);
        if(h>mH){ h=mH; w=h*(f.ratio||1); }
        try{ pdf.addImage(f.data,'JPEG',bx+(cw-w)/2,y+(fh-h)/2,w,h,undefined,'FAST'); }catch(e){}
      });
      y+=fh;
    });
  }
  y+=3;

  /* ── 6. RESPONSABLE ── */
  band('6. RESPONSABLE DEL REGISTRO');
  const RW=[62,48,42,42], RX=[M,M+62,M+110,M+152];
  npi(5);
  ['NOMBRES Y APELLIDOS','CARGO / PUESTO','FECHA DEL REGISTRO','FIRMA'].forEach((s,i)=>{
    cell(RX[i],RW[i],5,s,{bg:PL,bold:true,fs:6});
  });
  y+=5;
  npi(14);
  const rSel=$('frResponsable');
  const rNom=rSel?rSel.options[rSel.selectedIndex]?.text.split(' — ')[0]||'-':'-';
  cell(RX[0],RW[0],14,rNom,{fs:6});
  cell(RX[1],RW[1],14,'-',{fs:6}); // cargo: pendiente columna en Excel
  cell(RX[2],RW[2],14,datos.fechaReporte,{fs:6});
  cell(RX[3],RW[3],14,'',{fs:6});
  if(datos.firma){
    try{
      let h=10, w=h*(datos.firmaRatio||2);
      if(w>RW[3]-4){ w=RW[3]-4; h=w/(datos.firmaRatio||2); }
      pdf.addImage(datos.firma,'PNG',RX[3]+(RW[3]-w)/2,y+(14-h)/2,w,h);
    }catch(e){}
  }
  y+=14;

  /* ── SALIDA ── */
  PDF_BLOB=pdf.output('blob');
  if(PDF_URL){ try{ URL.revokeObjectURL(PDF_URL); }catch(e){} }
  PDF_URL=URL.createObjectURL(PDF_BLOB);
  if(descargar){ pdf.save(nombrePDF()); return PDF_BLOB; }
  return PDF_BLOB;
}

/* =========================================================
   PREVIEW
   ========================================================= */
async function visualizarPDF(){
  const blob=await generarPDF(false);
  if(!blob) return;
  $('frPdfFrame').src=PDF_URL;
  $('frPdfModal').classList.add('on');
  $('frPdfModal').setAttribute('aria-hidden','false');
}

function cerrarPreview(){
  $('frPdfModal').classList.remove('on');
  $('frPdfModal').setAttribute('aria-hidden','true');
  $('frPdfFrame').src='';
}

async function descargarPDFGenerado(){
  if(!PDF_BLOB){ const b=await generarPDF(false); if(!b) return; }
  const a=document.createElement('a');
  a.href=PDF_URL; a.download=nombrePDF();
  document.body.appendChild(a); a.click(); a.remove();
}

/* =========================================================
   GUARDAR BORRADOR (sin enviar correo, sin PDF adjunto)
   ========================================================= */
async function guardarBorrador(){
  if(!validarFlash()) return;
  const boton=document.querySelector('.frSend');
  const btnBorrador=document.querySelector('[onclick="guardarBorrador()"]');
  if(btnBorrador) btnBorrador.disabled=true;
  $('estado').textContent='Guardando borrador...';

  const datos=recogerDatos();
  // Sin PDF — solo datos del formulario
  google.script.run
    .withSuccessHandler(()=>{
      $('estado').textContent='Borrador guardado';
      toast('Borrador guardado correctamente.');
      if(btnBorrador) btnBorrador.disabled=false;
      // Recargar para reflejar el FLASH guardado (sin check)
      setTimeout(cargar,800);
    })
    .withFailureHandler(e=>{
      if(btnBorrador) btnBorrador.disabled=false;
      $('estado').textContent='Error';
      toast((e&&e.message)||'No se pudo guardar el borrador.',true);
    })
    .accGuardarFlash(TOKEN, datos); // sin PDF → el .gs no adjunta archivo
}

/* =========================================================
   GUARDAR Y ENVIAR (genera PDF, adjunta, envía correo)
   ========================================================= */
async function guardarYEnviar(){
  if(!validarFlash()) return;
  const boton=document.querySelector('.frSend');
  if(boton) boton.disabled=true;
  $('estado').textContent='Generando PDF...';
  try{
    const blob=await generarPDF(false);
    if(!blob){ if(boton) boton.disabled=false; return; }
    $('estado').textContent='Enviando...';
    const b64=await blobToBase64(blob);
    const datos=recogerDatos();
    datos.pdf={base64:b64, nombre:nombrePDF(), tipo:'application/pdf'};
    datos.archivo=datos.pdf;
    google.script.run
      .withSuccessHandler(r=>{
        const c=r.correo||{};
        if(c.enviado){
          FR.enviado=true; // activa el check ✓ en la pestaña
          toast(FR.enviado&&FLASH
            ?'Flash Report reenviado correctamente.'
            :'Flash Report enviado correctamente.');
        } else {
          toast('PDF generado pero el correo no pudo enviarse.',true);
        }
        $('estado').textContent='OK';
        if(boton) boton.disabled=false;
        setTimeout(cargar,900);
      })
      .withFailureHandler(e=>{
        if(boton) boton.disabled=false;
        $('estado').textContent='Error';
        toast((e&&e.message)||'No se pudo enviar.',true);
      })
      .accGuardarFlash(TOKEN, datos);
  }catch(e){
    if(boton) boton.disabled=false;
    $('estado').textContent='Error';
    toast(e.message||'No se pudo generar el PDF.',true);
  }
}

function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(blob);
  });
}

/* =========================================================
   UTILIDADES
   ========================================================= */
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function toast(msg,err=false){
  const host=$('toastHost')||document.body;
  const el=document.createElement('div');
  el.className='toastItem '+(err?'error':'');
  el.innerHTML='<span class="toastText"></span><button class="toastClose">×</button>';
  el.querySelector('.toastText').textContent=msg;
  el.querySelector('.toastClose').onclick=()=>el.remove();
  host.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>el.remove(),4500);
}

alIniciarSesion(cargar);
